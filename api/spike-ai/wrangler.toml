# H5 S1 step 0 spike (docs/H5-S1-SPIKE.md). Its own Worker and D1 — production (`planner-api`, D1 `planner`) is not
# touched. Delete both when the spike closes: `wrangler delete -c spike-ai/wrangler.toml` + `wrangler d1 delete planner-spike`.
name = "planner-spike-ai"
main = "index.ts"
compatibility_date = "2026-10-01"

[vars]
ANTHROPIC_MODEL = "claude-opus-5-5"
OAI_BASE = ""
OAI_MODEL = ""
OAI_MAX_FIELD = "max_tokens"
PROVIDER_CALL_CAP = "20"

[[d1_databases]]
binding = "DB"
database_name = "planner-spike"
database_id = "e510b883-e4a2-43f4-a807-9e871709f304"

[[workflows]]
name = "planner-spike-call"
binding = "CALL_WF"
class_name = "CallWorkflow"

[[ratelimits]]
name = "RL"
namespace_id = "1901"
simple = { limit = 20, period = 60 }

# One tick every 10 minutes; it does nothing unless /t/cron/arm armed a job (index.ts `scheduled`).
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
