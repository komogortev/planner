name = "planner-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Production only: the app URL(s) sign-in may return to; CORS admits their origins (src/config.ts).
# Local dev overrides this with `--var` in package.json's `dev` script — localhost never reaches production.
[vars]
ALLOWED_APP_URLS = "https://koplanner.pages.dev/"
# Which environment this Worker is (favicon cue, src/env/appEnv.ts). The local `dev` script overrides it to `local`.
APP_ENV = "prod"
# Model calls per user per rolling 24 h (src/aiCalls.ts, H5-MODELS D-86). A full day is about 3–6 calls.
AI_DAILY_CAP = "30"
# The operator brake (src/schedules.ts, D-129): "true" stops every account's schedules at once (shipped "true": flip to "false" and redeploy the Worker to start them).
SCHEDULES_PAUSED = "true"
# R6 nightly export target (src/nightlyExport.ts). Its token and the exported account's email are secrets the owner sets.
EXPORT_REPO = "komogortev/planner-data"

# Minute 5 of every hour: the schedule tick (src/schedules.ts, D-132). Then the nightly export, 07:17 UTC: overnight in North America, after the day's last notes and before the morning.
[triggers]
crons = ["5 * * * *", "17 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "planner"
# Filled in from `wrangler d1 create planner`. Not a secret — it is only usable with this account's credentials.
database_id = "40a3af08-9757-41aa-a448-d18f27430131"
migrations_dir = "migrations"

# Rate limits (src/ratelimit.ts). `period` may only be 10 or 60 seconds. Counters are per Cloudflare location and
# eventually consistent — an abuse guard, not accounting. Legit use is far below these: the client pushes at most every
# few seconds, and a sign-in is two requests. Per-IP limits are loose because several people can share an address.
[[ratelimits]]
name = "RL_AUTH_IP"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_PUSH_IP"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_PUSH_USER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# POST /log per IP (SLICE-ACCEPTANCE A5): its own budget, not the push one. The app sends at most one report per kind a
# minute (src/log/report.ts), so 10 leaves room for several devices behind one address. The global cap is in src/log.ts.
[[ratelimits]]
name = "RL_LOG_IP"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# Model calls per user (src/aiCalls.ts): a looping client or a stolen session spends the user's own key; the daily cap bounds
# the total, this bounds the burst.
[[ratelimits]]
name = "RL_AI_USER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# Every model call runs as one instance of this Workflow (H5-MODELS D-91): it outlives the request that started it.
[[workflows]]
name = "planner-model-call"
binding = "MODEL_CALL"
class_name = "ModelCallWorkflow"

[observability]
enabled = true
